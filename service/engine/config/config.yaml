#用户配置
user:
  userid: "{USERID}"

# 模型配置
model:
  model: "deepseek-reasoner"
  baseurl: "https://api.deepseek.com"
  apikey: "your-api-key"
  apitype: "openai" # openai 或者 anthropic
  contextwindow: 64000 # 上下文窗口大小，请参考模型文档设置，影响自动摘要功能的触发时机
  anthropicAuthHeaderTransfer: false # 如果true，那么通过Authorization: Bearer认证，如果为false，通过X-Api-Key认证
  stream: true # 是否开启流式输出，开启后可以实时看到模型的推理过程和工具调用信息
  maxtokens: 12800 # 每次请求的最大生成 token 数，默认 12800
  httptimeout: 600 # 单位/秒
  show_reasoning: false   # 显示推理内容，默认 false（不显示）

# MCP 服务配置
# Type 可选: "sse" 或 "streamable_http"
http_mcp:
  - name: "mcpexec"
    enabled: true
    type: "sse"
    endpoint: "http://127.0.0.1:8080/mcp"
    headers: {}  # 可选，如: {"Authorization": "Bearer xxx"}
    description: "MCP Exec ToolSet for executing commands via HTTP"

  # - name: "another-mcp"
  #   enabled: true
  #   type: "streamable_http"
  #   endpoint: "http://127.0.0.1:8080/mcp"
  #   headers: {}
  #   description: "Another MCP ToolSet example"

# 标准输入 MCP 配置
stdin_mcp:
  - name: "stdin-tool"
    enabled: true
    command: "npx"
    args: ["-y", "mcp-exec"]
    description: "MCP Exec ToolSet for executing commands via standard input"

